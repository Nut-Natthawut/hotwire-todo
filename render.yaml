# Render Blueprint: creates the Postgres database and the web service in one go.
# No secrets in this file: SECRET_KEY_BASE is generated by Render, DATABASE_URL comes from the database.
databases:
  - name: hotwire-todo-db
    plan: free
    region: singapore
    databaseName: hotwire_todo
    user: hotwire_todo

services:
  - type: web
    name: hotwire-todo
    runtime: docker          # builds the production Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /up
    envVars:
      # One database for the app + Solid Queue / Cache / Cable tables.
      - key: DATABASE_URL
        fromDatabase:
          name: hotwire-todo-db
          property: connectionString
      # Rails needs a secret in production; Render generates a random one.
      - key: SECRET_KEY_BASE
        generateValue: true
      # No separate worker on Render: run background jobs (broadcast_refresh_later_to) inside Puma.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # The Dockerfile starts Thruster on port 80 (Thruster runs Puma on 3000 behind it).
      - key: PORT
        value: "80"
